<header class="main-header style-three" *ngIf="showHeader">
  <div class="header-lower">
    <div class="outer-box header-flex">

      <div class="logo-box">
        <figure class="logo">
          <a routerLink="/home">
            <img src="assets/images/logoColor.png" alt="Klinia">
          </a>
        </figure>
      </div>

      <nav class="desktop-nav">
        <ul class="navigation">
          <li><a routerLink="/home">Inicio</a></li>
          <li><a routerLink="/home">Profesionales</a></li>
          <li><a routerLink="/clients">Pacientes</a></li>
        </ul>
      </nav>

      <div class="admin-user-menu desktop-admin">
        <div class="admin-avatar">
          <img src="assets/images/resource/author-1.png" alt="Administrador">
        </div>

        <div class="admin-info">
          <strong>Administrador</strong>
          <span>Panel Klinia</span>
        </div>

        <button type="button" class="logout-btn" (click)="logout()">
          <i class="ph ph-sign-out"></i>
          <span>Cerrar sesión</span>
        </button>
      </div>

      <button type="button" class="admin-mobile-toggler" (click)="toggleMobileMenu()">
  <span></span>
  <span></span>
  <span></span>
</button>

    </div>
  </div>
</header>

<div class="admin-mobile-menu" *ngIf="showHeader && isMobileMenuOpen">
  <div class="admin-mobile-backdrop" (click)="closeMobileMenu()"></div>

  <aside class="admin-mobile-panel">
    <button type="button" class="admin-mobile-close" (click)="closeMobileMenu()">×</button>

    <div class="admin-mobile-logo">
      <img src="assets/images/logoColor.png" alt="Klinia">
    </div>

    <nav class="admin-mobile-links">
      <a routerLink="/home" (click)="closeMobileMenu()">Inicio</a>
      <a routerLink="/home" (click)="closeMobileMenu()">Profesionales</a>
      <a routerLink="/clients" (click)="closeMobileMenu()">Pacientes</a>
    </nav>

    <button type="button" class="admin-mobile-logout" (click)="logout()">
      Cerrar sesión
    </button>
  </aside>
</div>
